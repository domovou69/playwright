name: Jira Triage

on:
  workflow_dispatch:
    inputs:
      issueKey:
        description: 'Specific Jira issue key to triage (leave blank to scan all candidates)'
        required: false
        type: string

jobs:
  triage:
    runs-on: ubuntu-latest
    env:
      JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
      JIRA_PROJECT: ${{ vars.JIRA_PROJECT }}
      JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    steps:
      - name: Log run parameters
        run: |
          echo "Target issue key: ${{ inputs.issueKey || '(none - scanning all candidates)' }}"

