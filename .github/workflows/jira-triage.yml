name: Jira Triage

on:
  workflow_dispatch:
    inputs:
      issueKey:
        description: 'Jira issue key(s) to triage, comma-separated (e.g. "ZED-1, ZED-2,ZED-3" - spacing does not matter). Leave blank to scan all candidates'
        required: false
        type: string

jobs:
  triage:
    runs-on: ubuntu-latest
    env:
      JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
      JIRA_PROJECT: ${{ vars.JIRA_PROJECT }}
      JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      ISSUE_KEYS: ${{ inputs.issueKey }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run triage
        run: node scripts/jira-triage.mjs
