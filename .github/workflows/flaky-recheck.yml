name: Flaky Recheck

# Re-runs suspected flaky tests several times in a row to see whether a failure reproduces. Not part of PR checks.
# The results go to Currents under a ciBuildId that starts with `flaky-recheck-`, so normal run statistics stay clean and
# `/flaky-triage` finds the run by that prefix.

on:
  workflow_dispatch:
    inputs:
      grep:
        description: 'Playwright --grep: test IDs like "RT-14|WP-07", or a tag such as "@FLAKY" (every test marked @FLAKY:<KEY>)'
        required: true
        default: '@FLAKY'
        type: string
      repeat:
        description: 'Repeats per test (1-10). Kept small: production site, no load'
        required: false
        default: '5'
        type: string

permissions:
  contents: read

concurrency:
  group: flaky-recheck

jobs:
  recheck:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      CURRENTS_PROJECT_ID: OOKVTP
      CURRENTS_RECORD_KEY: ${{ secrets.CURRENTS_RECORD_KEY }}
      CURRENTS_CI_BUILD_ID: flaky-recheck-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm 12 (Node 24 ships npm 11, package.json requires >=12)
        run: npm install -g npm@12

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Re-run the selected tests
        env:
          GREP: ${{ inputs.grep }}
          REPEAT: ${{ inputs.repeat }}
        run: |
          if ! [[ "$REPEAT" =~ ^([1-9]|10)$ ]]; then echo "repeat must be 1-10"; exit 1; fi
          npx playwright test --grep "$GREP" --repeat-each "$REPEAT" --workers 1 --retries 0
